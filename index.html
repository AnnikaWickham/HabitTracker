<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habit Tracker</title>
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#1b2540;--mute:#6b7690;--line:#dde2ec;--empty:#f2f4f9;--acc:#1f8a70;--acc-rgb:31,138,112;--on:#fff;--today:#1b2540}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--panel:#171f31;--ink:#e8ecf5;--mute:#8d99b3;--line:#27324a;--empty:#1e2840;--acc:#3ccf9f;--acc-rgb:60,207,159;--on:#08170f;--today:#e8ecf5}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;padding:24px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:340px 1fr;gap:20px;max-width:1100px;margin:0 auto;min-height:calc(100vh - 48px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
.date{margin:0 0 18px;color:var(--mute);font-size:14px}
.add{display:flex;gap:8px;margin-bottom:16px}
.add input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--empty)}
.add button{padding:10px 14px;border:0;border-radius:10px;background:var(--acc);color:var(--on);font-weight:600;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.item{flex:1;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;min-width:0}
.item input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--c);cursor:pointer;display:grid;place-items:center}
.item input:checked{background:var(--c)}
.item input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;color:var(--mute);white-space:nowrap}
.del{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;border-radius:6px;padding:2px 8px}
.del:hover{color:var(--ink)}
.empty{color:var(--mute);font-size:14px;padding:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--empty);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:28px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--mute)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h2{font-size:26px;letter-spacing:-.03em;margin:0}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:6px 12px;cursor:pointer;margin-left:6px}
.ghost:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{color:var(--mute);font-size:13px;text-align:center;padding:4px 0}
.cell{min-height:68px;border:0;border-radius:10px;background:var(--empty);padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.cell.hi{color:var(--on)}
.cell:disabled{opacity:.4;cursor:default}
.cell .n{font-size:14px}
.cell .f{font-size:12px;align-self:flex-end;opacity:.85}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.cell.today .n{font-weight:800}
.cell.sel{outline:2px solid var(--ink);outline-offset:2px}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:14px;font-size:12px;color:var(--mute)}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
@media(max-width:820px){.app{grid-template-columns:1fr}body{padding:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Habit Tracker</h1>
    <p class="date" id="selLabel"></p>
    <div class="add">
      <input id="newName" maxlength="40" placeholder="New habit, e.g. Read 20 minutes" aria-label="New habit name">
      <button id="addBtn">Add habit</button>
    </div>
    <ul id="list"></ul>
  </aside>
  <main class="panel">
    <div class="stats" id="stats"></div>
    <div class="calhead">
      <h2 id="monthTitle"></h2>
      <div>
        <button class="ghost" id="prev" aria-label="Previous month">&lsaquo;</button>
        <button class="ghost" id="todayBtn">Today</button>
        <button class="ghost" id="next" aria-label="Next month">&rsaquo;</button>
      </div>
    </div>
    <div class="grid dow" id="dow"></div>
    <div class="grid" id="cal"></div>
    <div class="legend" id="legend"></div>
  </main>
</div>
<script>
const KEY = 'habit-tracker-v1';
const COLORS = ['#3a86ff', '#8338ec', '#ff006e', '#fb8500', '#2a9d8f', '#e9a820'];
let S = { habits: [], done: {} };
try { const r = localStorage.getItem(KEY); if (r) S = JSON.parse(r); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayS = () => ymd(new Date());
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);

let sel = todayS();
let view = new Date(); view.setDate(1);

const isDone = (id, s) => (S.done[s] || []).includes(id);
const active = s => S.habits.filter(h => h.created <= s);
const frac = s => { const a = active(s); return a.length ? a.filter(h => isDone(h.id, s)).length / a.length : null; };

function streak(h) {
  let s = todayS();
  if (!isDone(h.id, s)) s = addDays(s, -1);
  let n = 0;
  while (s >= h.created && isDone(h.id, s)) { n++; s = addDays(s, -1); }
  return n;
}
function best(h) {
  let s = h.created, run = 0, b = 0;
  const t = todayS();
  while (s <= t) { if (isDone(h.id, s)) { run++; b = Math.max(b, run); } else run = 0; s = addDays(s, 1); }
  return b;
}
function monthRate() {
  const y = view.getFullYear(), m = view.getMonth(), t = todayS();
  let d = 0, a = 0;
  for (let i = 1; i <= new Date(y, m + 1, 0).getDate(); i++) {
    const s = ymd(new Date(y, m, i));
    if (s > t) break;
    const ac = active(s);
    a += ac.length;
    d += ac.filter(h => isDone(h.id, s)).length;
  }
  return a ? Math.round(100 * d / a) + '%' : '-';
}

function toggle(id) {
  const ids = S.done[sel] || (S.done[sel] = []);
  const i = ids.indexOf(id);
  if (i >= 0) ids.splice(i, 1);
  else {
    ids.push(id);
    const h = S.habits.find(x => x.id === id);
    if (sel < h.created) h.created = sel; // backfilling an earlier day
  }
  save(); render();
}
function addHabit() {
  const name = $('newName').value.trim();
  if (!name) return;
  S.habits.push({ id: 'h' + Date.now(), name, color: COLORS[S.habits.length % COLORS.length], created: todayS() });
  $('newName').value = '';
  save(); render();
}
function removeHabit(id) {
  const h = S.habits.find(x => x.id === id);
  if (!confirm('Delete "' + h.name + '" and its history?')) return;
  S.habits = S.habits.filter(x => x.id !== id);
  for (const k in S.done) S.done[k] = S.done[k].filter(x => x !== id);
  save(); render();
}

function renderList() {
  const d = parse(sel);
  const label = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  $('selLabel').textContent = sel === todayS() ? 'Today, ' + label : label;
  if (!S.habits.length) { $('list').innerHTML = '<li class="empty">No habits yet. Add your first one above.</li>'; return; }
  $('list').innerHTML = S.habits.map(h => {
    const n = streak(h);
    return `<li><label class="item" style="--c:${h.color}">
      <input type="checkbox" data-id="${h.id}" ${isDone(h.id, sel) ? 'checked' : ''}>
      <span class="nm">${esc(h.name)}</span>
      <span class="st">${n ? n + ' day streak' : ''}</span></label>
      <button class="del" data-del="${h.id}" aria-label="Delete ${esc(h.name)}">&times;</button></li>`;
  }).join('');
}
function renderStats() {
  const t = todayS(), a = active(t), done = a.filter(h => isDone(h.id, t)).length;
  const longest = S.habits.reduce((m, h) => Math.max(m, best(h)), 0);
  $('stats').innerHTML =
    `<div class="stat"><b>${done}/${a.length}</b><span>Done today</span></div>` +
    `<div class="stat"><b>${monthRate()}</b><span>Completed this month</span></div>` +
    `<div class="stat"><b>${longest} ${longest === 1 ? 'day' : 'days'}</b><span>Longest streak</span></div>`;
}
const shade = f => `rgba(var(--acc-rgb),${(0.14 + 0.86 * f).toFixed(2)})`;
function renderCal() {
  const y = view.getFullYear(), m = view.getMonth(), t = todayS();
  $('monthTitle').textContent = view.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const now = new Date();
  $('next').disabled = y === now.getFullYear() && m === now.getMonth();
  let html = '';
  for (let i = 0; i < new Date(y, m, 1).getDay(); i++) html += '<div></div>';
  for (let i = 1; i <= new Date(y, m + 1, 0).getDate(); i++) {
    const s = ymd(new Date(y, m, i)), f = frac(s), a = active(s);
    const cnt = a.length ? a.filter(h => isDone(h.id, s)).length + '/' + a.length : '';
    const bg = f ? `style="background:${shade(f)}"` : '';
    html += `<button class="cell${f > 0.55 ? ' hi' : ''}${s === t ? ' today' : ''}${s === sel ? ' sel' : ''}" data-day="${s}" ${bg} ${s > t ? 'disabled' : ''}>
      <span class="n">${i}</span><span class="f">${cnt}</span></button>`;
  }
  $('cal').innerHTML = html;
}
function render() { renderList(); renderStats(); renderCal(); }

$('dow').innerHTML = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div>${d}</div>`).join('');
$('legend').innerHTML = 'Less ' + [0, 0.25, 0.5, 0.75, 1].map(f => `<i style="background:${f ? shade(f) : 'var(--empty)'}"></i>`).join('') + ' More';
$('addBtn').onclick = addHabit;
$('newName').onkeydown = e => { if (e.key === 'Enter') addHabit(); };
$('list').onchange = e => { if (e.target.dataset.id) toggle(e.target.dataset.id); };
$('list').onclick = e => { const b = e.target.closest('[data-del]'); if (b) removeHabit(b.dataset.del); };
$('cal').onclick = e => { const b = e.target.closest('[data-day]'); if (b) { sel = b.dataset.day; render(); } };
$('prev').onclick = () => { view.setMonth(view.getMonth() - 1); renderCal(); renderStats(); };
$('next').onclick = () => { view.setMonth(view.getMonth() + 1); renderCal(); renderStats(); };
$('todayBtn').onclick = () => { sel = todayS(); view = new Date(); view.setDate(1); render(); };
render();
</script>
</body>
</html>
